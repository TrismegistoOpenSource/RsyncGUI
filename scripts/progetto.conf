# Configurazione del progetto per gli script comuni (ci-locale.sh,
# pubblica-release.sh). Sintassi bash: viene letta con "source".

NOME=RsyncGUI
# variabile che sposta la configurazione dell'app (le prove non toccano mai
# quella vera dell'utente, regole del workspace "Sicurezza dei dati utente")
CONFIG_VAR=RSYNCGUI_CONFIG_DIR

# build tag di go vet e go test, per sistema
GO_TAGS_linux=webkit2_41
GO_TAGS_macos=
GO_TAGS_windows=

# pacchetti di sviluppo che devono esserci su Linux (Debian/Ubuntu)
APT_linux="libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config"

# ciò che il sistema consegna in ../build e che finisce nella release
# (prodotto da scripts/build.sh + scripts/pacchetto.sh)
# (con gli elenchi di integrità INTEGRITA-<sistema>.txt dell'autoverifica: vanno fra gli asset firmati)
ARTEFATTI_macos="RsyncGUI-AppleSilicon.zip RsyncGUI-Intel.zip INTEGRITA-macos-arm64.txt INTEGRITA-macos-amd64.txt"
ARTEFATTI_linux="RsyncGUI-Linux-x86_64.AppImage INTEGRITA-linux-amd64.txt"
ARTEFATTI_windows="RsyncGUI-Windows.zip INTEGRITA-windows-amd64.txt"
